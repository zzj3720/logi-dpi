name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PION_REV: 585688d11bc507ddd86768ba46631308065f1adb

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Static Liquid Glass gate
        run: '! grep -rn "Glass::liquid" pion/'

      - name: Fetch pinned invar
        run: sh tools/deps.sh

      - name: Checkout pinned pion
        uses: actions/checkout@v4
        with:
          repository: AFK-surf/pion
          ref: ${{ env.PION_REV }}
          path: _pion
          persist-credentials: false

      - name: Cache pion toolchain (macOS arm64)
        id: pion-cache
        uses: actions/cache@v4
        with:
          path: |
            _pion/out/pionc2
            _pion/out/qbe
            _pion/out/libpionrt.a
          key: pion-macos-arm64-${{ env.PION_REV }}

      - name: Bootstrap pionc2 (macOS arm64)
        if: steps.pion-cache.outputs.cache-hit != 'true'
        run: |
          set -eu
          OUT_DIR="$PWD/_pion/out"
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT
          mkdir -p "$OUT_DIR"
          export PION_QBE="$OUT_DIR/qbe"
          export PION_RT_LIB="$OUT_DIR/libpionrt.a"
          PION_RT_CLI_LIB="$OUT_DIR/libpionrt_cli.a"
          sh _pion/scripts/build-qbe.sh "$PION_QBE"
          cc -std=c11 -O2 -fno-asynchronous-unwind-tables -Wall -Wextra -Werror \
            -c _pion/runtime/pion_rt.c -o "$OUT_DIR/pion_rt.o"
          ar rcs "$PION_RT_LIB" "$OUT_DIR/pion_rt.o"
          cc -std=c11 -O2 -fno-asynchronous-unwind-tables -Wall -Wextra -Werror \
            -c _pion/runtime/pion_cli.c -o "$OUT_DIR/pion_cli.o"
          ar rcs "$PION_RT_CLI_LIB" "$OUT_DIR/pion_rt.o" "$OUT_DIR/pion_cli.o"
          gzip -dc _pion/bootstrap/pionc-seed.ssa.gz > "$TMP_DIR/seed.ssa"
          "$PION_QBE" -t arm64_apple -o "$TMP_DIR/pionc0.s" "$TMP_DIR/seed.ssa"
          cc "$TMP_DIR/pionc0.s" "$PION_RT_CLI_LIB" -lm -lpthread -o "$TMP_DIR/pionc0"
          PION_RT_LIB="$PION_RT_CLI_LIB" "$TMP_DIR/pionc0" build -o "$TMP_DIR/pionc1" _pion/compiler/src/core _pion/compiler/src/cli/main.pion
          PION_RT_LIB="$PION_RT_CLI_LIB" "$TMP_DIR/pionc1" build -o "$OUT_DIR/pionc2" _pion/compiler/src/core _pion/compiler/src/cli/main.pion

      - name: Export pion env
        run: |
          echo "PIONC=$PWD/_pion/out/pionc2" >> "$GITHUB_ENV"
          echo "PION_QBE=$PWD/_pion/out/qbe" >> "$GITHUB_ENV"
          echo "PION_RT_LIB=$PWD/_pion/out/libpionrt.a" >> "$GITHUB_ENV"

      - name: Check workspace & run dpi_ui unit tests
        run: |
          "$PIONC" check --json
          "$PIONC" test --json pion/packages/dpi_ui

      - name: Run hidpp_core C unit tests
        run: |
          mkdir -p out
          cc -std=c11 -O2 -Wall -Wextra -Werror -DHIDPP_CORE_TEST -I pion/cmd/mousedpi \
            pion/cmd/mousedpi/hidpp_core_test.c -o out/hidpp_core_test -pthread
          ./out/hidpp_core_test

      - name: Compile-check C/ObjC backend sources
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -c pion/cmd/mousedpi/hidpp_core.c -o /tmp/c.o
          clang -fobjc-arc -O2 -Wall -Wextra -Werror -c pion/cmd/mousedpi/hidpp_macos.m -o /tmp/m.o
          rm -f /tmp/c.o /tmp/m.o

      - name: Build macOS app bundle
        run: |
          sh tools/build-macos.sh
          test -x out/MouseDPI
          test -x out/MouseDPI.app/Contents/MacOS/MouseDPI
          test -f out/MouseDPI.app/Contents/Info.plist
          test -f out/MouseDPI.app/Contents/Resources/AppIcon.icns

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Static Liquid Glass gate
        run: '! grep -rn "Glass::liquid" pion/'

      - name: Install Linux host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libsoup-3.0-dev \
            libepoxy-dev \
            libpango1.0-dev \
            libfontconfig1-dev \
            libgdk-pixbuf-2.0-dev \
            zlib1g-dev \
            pkg-config

      - name: Fetch pinned invar
        run: sh tools/deps.sh

      - name: Checkout pinned pion
        uses: actions/checkout@v4
        with:
          repository: AFK-surf/pion
          ref: ${{ env.PION_REV }}
          path: _pion
          persist-credentials: false

      - name: Cache pion toolchain (Linux x86_64)
        id: pion-cache
        uses: actions/cache@v4
        with:
          path: |
            _pion/out/pionc2
            _pion/out/qbe
            _pion/out/libpionrt.a
          key: pion-linux-x86_64-${{ env.PION_REV }}

      - name: Bootstrap pionc2 (Linux x86_64)
        if: steps.pion-cache.outputs.cache-hit != 'true'
        run: |
          set -eu
          OUT_DIR="$PWD/_pion/out"
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT
          mkdir -p "$OUT_DIR"
          export CC=cc
          export PION_QBE="$OUT_DIR/qbe"
          export PION_RT_LIB="$OUT_DIR/libpionrt.a"
          PION_RT_CLI_LIB="$OUT_DIR/libpionrt_cli.a"
          sh _pion/scripts/build-qbe.sh "$PION_QBE"
          cc -std=c11 -O2 -fno-asynchronous-unwind-tables -Wall -Wextra -Werror \
            -c _pion/runtime/pion_rt.c -o "$OUT_DIR/pion_rt.o"
          ar rcs "$PION_RT_LIB" "$OUT_DIR/pion_rt.o"
          cc -std=c11 -O2 -fno-asynchronous-unwind-tables -Wall -Wextra -Werror \
            -c _pion/runtime/pion_cli.c -o "$OUT_DIR/pion_cli.o"
          ar rcs "$PION_RT_CLI_LIB" "$OUT_DIR/pion_rt.o" "$OUT_DIR/pion_cli.o"
          gzip -dc _pion/bootstrap/pionc-seed.ssa.gz > "$TMP_DIR/seed.ssa"
          "$PION_QBE" -t amd64_sysv --obj -o "$TMP_DIR/pionc0.o" "$TMP_DIR/seed.ssa"
          cc "$TMP_DIR/pionc0.o" "$PION_RT_CLI_LIB" -lm -lpthread -o "$TMP_DIR/pionc0"
          PION_RT_LIB="$PION_RT_CLI_LIB" "$TMP_DIR/pionc0" build -o "$TMP_DIR/pionc1" _pion/compiler/src/core _pion/compiler/src/cli/main.pion
          PION_RT_LIB="$PION_RT_CLI_LIB" "$TMP_DIR/pionc1" build -o "$OUT_DIR/pionc2" _pion/compiler/src/core _pion/compiler/src/cli/main.pion

      - name: Export pion env
        run: |
          echo "PIONC=$PWD/_pion/out/pionc2" >> "$GITHUB_ENV"
          echo "PION_QBE=$PWD/_pion/out/qbe" >> "$GITHUB_ENV"
          echo "PION_RT_LIB=$PWD/_pion/out/libpionrt.a" >> "$GITHUB_ENV"

      - name: Check workspace & run dpi_ui unit tests
        run: |
          "$PIONC" check --json
          "$PIONC" test --json pion/packages/dpi_ui

      - name: Run hidpp_core C unit tests (ASan + UBSan)
        run: |
          mkdir -p out
          cc -std=c11 -g -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -DHIDPP_CORE_TEST -I pion/cmd/mousedpi \
            pion/cmd/mousedpi/hidpp_core_test.c -o out/hidpp_core_test -pthread
          ./out/hidpp_core_test

      - name: Compile-check C backend sources
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pthread -c pion/cmd/mousedpi/hidpp_core.c -o /tmp/c.o
          cc -std=c11 -O2 -Wall -Wextra -Werror -pthread -c pion/cmd/mousedpi/hidpp_linux.c -o /tmp/l.o
          rm -f /tmp/c.o /tmp/l.o

      - name: Build Linux binary
        run: |
          sh tools/build-linux.sh
          test -x out/mousedpi

      - name: Build Linux shots binary
        run: |
          "$PIONC" build --release pion/cmd/shots -o out/dpi_shots
          test -x out/dpi_shots

      - name: Shell script syntax check
        run: for s in tools/deps.sh tools/build-macos.sh tools/build-linux.sh tools/install-linux.sh tools/build-win.sh; do sh -n "$s"; done

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Static Liquid Glass gate
        run: '! grep -rn "Glass::liquid" pion/'

      - name: Fetch pinned invar & WebView2
        run: sh tools/deps.sh

      - name: Checkout pinned pion
        uses: actions/checkout@v4
        with:
          repository: AFK-surf/pion
          ref: ${{ env.PION_REV }}
          path: _pion
          persist-credentials: false

      - name: Cache pion toolchain (Windows x64)
        id: pion-cache
        uses: actions/cache@v4
        with:
          path: |
            _pion/out/pionc2.exe
            _pion/out/qbe.exe
            _pion/out/libpionrt.a
          key: pion-windows-x64-${{ env.PION_REV }}

      - name: Bootstrap pionc2.exe (Windows x64 MinGW)
        if: steps.pion-cache.outputs.cache-hit != 'true'
        run: |
          set -eu
          OUT_DIR="$PWD/_pion/out"
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT
          mkdir -p "$OUT_DIR"
          CC=gcc
          CC="$CC" sh _pion/scripts/build-qbe.sh "$OUT_DIR/qbe.exe"
          "$CC" -std=c11 -O2 -fno-unwind-tables -fno-asynchronous-unwind-tables -fno-ident \
            -Wall -Wextra -Werror -c _pion/runtime/pion_rt.c -o "$OUT_DIR/pion_rt.o"
          ar rcs "$OUT_DIR/libpionrt.a" "$OUT_DIR/pion_rt.o"
          "$CC" -std=c11 -O2 -fno-unwind-tables -fno-asynchronous-unwind-tables -fno-ident \
            -Wall -Wextra -Werror -c _pion/runtime/pion_cli.c -o "$OUT_DIR/pion_cli.o"
          ar rcs "$OUT_DIR/libpionrt_cli.a" "$OUT_DIR/pion_rt.o" "$OUT_DIR/pion_cli.o"
          gzip -dc _pion/bootstrap/pionc-seed.ssa.gz > "$TMP_DIR/seed.ssa"
          "$OUT_DIR/qbe.exe" -t amd64_win -o "$TMP_DIR/pionc0.s" "$TMP_DIR/seed.ssa"
          "$CC" -Wa,-mbig-obj -c "$TMP_DIR/pionc0.s" -o "$TMP_DIR/pionc0.o"
          "$CC" "$TMP_DIR/pionc0.o" "$OUT_DIR/libpionrt_cli.a" -lm -lws2_32 -Wl,--stack,16777216 -o "$TMP_DIR/pionc0.exe"
          export PION_QBE="$OUT_DIR/qbe.exe"
          export PION_RT_LIB="$OUT_DIR/libpionrt.a"
          PION_TARGET=amd64_win "$TMP_DIR/pionc0.exe" build --emit-obj "$TMP_DIR/pionc1.o" _pion/compiler/src/core _pion/compiler/src/cli/main.pion
          "$CC" "$TMP_DIR/pionc1.o" "$OUT_DIR/libpionrt_cli.a" -lm -lws2_32 -Wl,--stack,16777216 -o "$TMP_DIR/pionc1.exe"
          PION_RT_LIB="$OUT_DIR/libpionrt_cli.a" "$TMP_DIR/pionc1.exe" build -o "$OUT_DIR/pionc2.exe" _pion/compiler/src/core _pion/compiler/src/cli/main.pion

      - name: Export pion env
        run: |
          echo "PIONC=$PWD/_pion/out/pionc2.exe" >> "$GITHUB_ENV"
          echo "PION_QBE=$PWD/_pion/out/qbe.exe" >> "$GITHUB_ENV"
          echo "PION_RT_LIB=$PWD/_pion/out/libpionrt.a" >> "$GITHUB_ENV"
          echo "PION_SRC=$PWD/_pion" >> "$GITHUB_ENV"

      - name: Check workspace & run dpi_ui unit tests
        run: |
          "$PIONC" check --json
          "$PIONC" test --json pion/packages/dpi_ui

      - name: Run hidpp_core C unit tests (MSVC clang)
        run: |
          mkdir -p out
          LLVM_BIN="/c/Program Files/LLVM/bin"
          "$LLVM_BIN/clang.exe" -std=c11 -O2 -Wall -Wextra -Werror -D_CRT_SECURE_NO_WARNINGS -DHIDPP_CORE_TEST -I pion/cmd/mousedpi \
            pion/cmd/mousedpi/hidpp_core_test.c -o out/hidpp_core_test.exe
          ./out/hidpp_core_test.exe

      - name: Compile-check C backend sources (MSVC clang)
        run: |
          mkdir -p out
          LLVM_BIN="/c/Program Files/LLVM/bin"
          "$LLVM_BIN/clang.exe" -std=c11 -O2 -Wall -Wextra -Werror -D_CRT_SECURE_NO_WARNINGS -c pion/cmd/mousedpi/hidpp_core.c -o out/c.obj
          "$LLVM_BIN/clang.exe" -std=c11 -O2 -Wall -Wextra -Werror -D_CRT_SECURE_NO_WARNINGS -c pion/cmd/mousedpi/hidpp_win.c -o out/w.obj
          rm -f out/c.obj out/w.obj

      - name: Build Windows binary (MSVC clang + lld)
        run: |
          LLVM_BIN="/c/Program Files/LLVM/bin" sh tools/build-win.sh
          test -f out/MouseDPI.exe
